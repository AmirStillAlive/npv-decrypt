<!doctype html>
<!--
  منبع تصویر پیش‌نمایش شبکه‌های اجتماعی (og.png).
  این فایل فقط برای تولید تصویر است و وارد باندل نمی‌شود.

  ساخت:
    node web/scripts/build-og.mjs
  نیازمند Google Chrome یا Edge روی همین دستگاه.
-->
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #1c1c1f;
        color: #f7f7f8;
        font-family: "Vazirmatn", sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        position: relative;
      }
      /* هاله نور گرم در گوشه، هم‌خوان با رنگ برند */
      .glow {
        position: absolute;
        width: 820px; height: 820px;
        top: -420px; left: -300px;
        background: radial-gradient(circle, rgba(245,165,36,0.16) 0%, rgba(245,165,36,0) 68%);
      }
      .wrap {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        width: 100%;
        padding: 58px 78px 46px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        align-self: flex-start;
        padding: 11px 22px;
        border: 1px solid rgba(247,247,248,0.14);
        border-radius: 999px;
        background: rgba(247,247,248,0.05);
        font-size: 23px;
        font-weight: 500;
        color: #c9c9d1;
      }
      .dot {
        width: 11px; height: 11px;
        border-radius: 50%;
        background: #4ade80;
        box-shadow: 0 0 0 5px rgba(74,222,128,0.16);
      }
      h1 {
        font-size: 76px;
        font-weight: 800;
        line-height: 1.24;
        letter-spacing: -0.5px;
        margin-top: 28px;
      }
      h1 .accent { color: #f5a524; }
      .sub {
        margin-top: 18px;
        font-size: 29px;
        line-height: 1.7;
        color: #a5a5b0;
        font-weight: 400;
        max-width: 900px;
      }
      .row {
        display: flex;
        gap: 14px;
        margin-top: 32px;
        direction: ltr;
        justify-content: flex-start;
      }
      .chip {
        font-size: 21px;
        font-weight: 600;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        padding: 9px 17px;
        border-radius: 10px;
        background: rgba(247,247,248,0.07);
        border: 1px solid rgba(247,247,248,0.12);
        color: #e6e6ea;
        direction: ltr;
      }
      .foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-top: 1px solid rgba(247,247,248,0.1);
        padding-top: 22px;
        font-size: 21px;
        color: #8b8b97;
      }
      .foot .host { direction: ltr; font-family: ui-monospace, Menlo, Consolas, monospace; }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="wrap">
      <div>
        <div class="badge"><span class="dot"></span> کاملا داخل مرورگر، بدون آپلود فایل</div>
        <h1>رمزگشایی کانفیگ<br /><span class="accent">NPV Tunnel</span></h1>
        <p class="sub">
          فایل را رها کنید تا به JSON خوانا و لینک آماده ورود تبدیل شود.<br />
          بدون نصب، بدون حساب کاربری، بدون سرور.
        </p>
        <div class="row">
          <span class="chip">.npvt</span>
          <span class="chip">.npvs</span>
          <span class="chip">vmess</span>
          <span class="chip">vless</span>
          <span class="chip">trojan</span>
        </div>
      </div>
      <div class="foot">
        <span>متن‌باز، پروانه MIT</span>
        <span class="host">amirstillalive.github.io/npv-decrypt</span>
      </div>
    </div>
  </body>
</html>
