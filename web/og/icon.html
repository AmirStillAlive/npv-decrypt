<!doctype html>
<!--
  منبع apple-touch-icon. همان قفل favicon.svg ولی با پس‌زمینه گرافیت و بدون حاشیه،
  چون iOS گرادیان شفاف را خودش اضافه می‌کند و لبه‌ها را گرد می‌کند.
-->
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <style>
      html, body { width: 180px; height: 180px; margin: 0; overflow: hidden; }
      body {
        background: #1c1c1f;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      img { width: 128px; height: 128px; display: block; }
    </style>
  </head>
  <body>
    <img src="../public/favicon.svg" alt="" />
  </body>
</html>
